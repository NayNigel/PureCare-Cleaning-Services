<!DOCTYPE html>
<html lang="en">
 <head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>
   Enquiry | PureCare Cleaning Services
  </title>
  <meta content="PureCare Cleaning Services provides professional residential and commercial cleaning solutions in Johannesburg and surrounding areas." name="description"/>
  <link href="css/style.css" rel="stylesheet"/>
 </head>
 <body>
  <header>
   <div class="brand">
    PURECARE
    <span>
     CLEANING SERVICES
    </span>
   </div>
   <nav aria-label="Main navigation">
    <a href="index.html">
     Home
    </a>
    <a href="about.html">
     About Us
    </a>
    <a href="services.html">
     Services
    </a>
    <a href="enquiry.html">
     Enquiry
    </a>
    <a href="contact.html">
     Contact
    </a>
   </nav>
  </header>
  <main>
   <section class="page-heading">
    <p class="eyebrow">
     SERVICE ENQUIRY
    </p>
    <h1>
     Tell us what you need cleaned.
    </h1>
    <p>
     Complete the form below with your requirements.
    </p>
   </section>
   <section class="form-section">
    <form action="#" method="post">
     <label for="name">
      Full name
     </label>
     <input autocomplete="name" id="name" name="name" required="" type="text"/>
     <label for="phone">
      Phone number
     </label>
     <input autocomplete="tel" id="phone" name="phone" required="" type="tel"/>
     <label for="email">
      Email address
     </label>
     <input autocomplete="email" id="email" name="email" required="" type="email"/>
     <label for="property">
      Property type
     </label>
     <select id="property" name="property" required="">
      <option value="">
       Select property type
      </option>
      <option>
       Home
      </option>
      <option>
       Office
      </option>
      <option>
       Other business
      </option>
     </select>
     <label for="service">
      Service required
     </label>
     <select id="service" name="service" required="">
      <option value="">
       Select a service
      </option>
      <option>
       Regular residential cleaning
      </option>
      <option>
       Deep cleaning
      </option>
      <option>
       Office cleaning
      </option>
      <option>
       Move-in / Move-out cleaning
      </option>
      <option>
       Carpet and upholstery cleaning
      </option>
      <option>
       Post-renovation cleaning
      </option>
     </select>
     <label for="date">
      Preferred date
     </label>
     <input id="date" name="date" required="" type="date"/>
     <label for="details">
      Cleaning requirements
     </label>
     <textarea id="details" name="details" required="" rows="6"></textarea>
     <button type="submit">
      Submit Enquiry
     </button>
    </form>
   </section>
  </main>
  <footer>
   <p>
    <strong>
     PURECARE CLEANING SERVICES
    </strong>
   </p>
   <p>
    Johannesburg and surrounding areas.
   </p>
   <p>
    &copy; 2026 PureCare Cleaning Services.
   </p>
  </footer>
 </body>
</html>
